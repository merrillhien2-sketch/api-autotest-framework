[pytest]
# 将项目根目录加入 sys.path，保证包导入稳定
pythonpath = .

# 测试用例目录
testpaths = testcases

# 命令行默认参数：
#   --html             指定 HTML 报告输出路径
#   --self-contained-html  将 CSS/JS 内联到单个 HTML 文件，便于分发
#   -v                 显示每个用例的详细名称
#   -s                 不捕获标准输出，便于查看 loguru 运行日志
#   --tb=short         失败时输出简短回溯
addopts = --html=reports/report.html --self-contained-html -v -s --tb=short

# 自定义标记，用于用例分类（避免 marker 未注册警告）
markers =
    smoke: 冒烟测试用例
    login: 登录接口用例
    articles: 文章接口用例
    users: 用户接口用例
    auth: 鉴权相关用例

# 日志相关配置（与 loguru 配合）
log_cli = false
